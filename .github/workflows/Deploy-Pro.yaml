name: Deploy-Production

on:
  push:
    branches:
      - pro
  workflow_dispatch:

jobs:
  Deploy:
    name: Build and Deploy
    runs-on: gericare-production
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          path: ${{ github.ref_name }}
          clean: true

      - name: Create Environment File
        working-directory: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env

          echo "Environment file created"
          ls -lah .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: View Environment File
        working-directory: ${{ github.ref_name }}
        run: |
          echo "===== .env content ====="
          cat .env
          echo "========================"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: ${{ github.ref_name }}
        run: |
          bun install --frozen-lockfile

      - name: Build Application
        working-directory: ${{ github.ref_name }}
        run: |
          echo "Building application"
          echo "Source path:"
          pwd

          bun run build

      - name: Deploy Application
        working-directory: ${{ github.ref_name }}
        run: |
          DEPLOY_PATH="/var/www/html/${{ github.event.repository.name }}/${{ github.ref_name }}"

          echo "Deploying application"
          echo "Source path:"
          pwd
          echo "Deploy path: $DEPLOY_PATH"

          mkdir -p "$DEPLOY_PATH"

          rm -rf "$DEPLOY_PATH"/*

          cp -a dist/. "$DEPLOY_PATH/"

          echo "Deployment completed"
          echo "Files deployed:"
          ls -lah "$DEPLOY_PATH"

      - name: Verify Deployment
        working-directory: ${{ github.ref_name }}
        run: |
          DEPLOY_PATH="/var/www/html/${{ github.event.repository.name }}/${{ github.ref_name }}"

          if [ ! -f "$DEPLOY_PATH/index.html" ]; then
            echo "ERROR: index.html not found in $DEPLOY_PATH"
            exit 1
          fi

          echo "Deployment verified successfully"
          echo "Source path:"
          pwd
          echo "Deployment path:"
          echo "$DEPLOY_PATH"

          ls -lah "$DEPLOY_PATH/index.html"
